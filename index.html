<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IPTV Sync</title>
    <!-- Google's Cast receiver library: the session with the sender and the messages. -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
      /* 1rem: 10px on a 1920-wide screen, so what came with 2026-11-18 (Next episode, the ring, Episodes) is as big on a 1280-wide Chromecast page. */
      html { font-size: 0.5208333vw; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
      #line { position: absolute; left: 6%; right: 6%; bottom: 7%; text-align: center; pointer-events: none; }
      #line.top { bottom: auto; top: 7%; }
      #line span { display: inline-block; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 40px; font-weight: 600; line-height: 1.3; padding: 2px 18px; border-radius: 6px; white-space: pre-line; }
      #title { position: absolute; left: 6%; top: 6%; color: #fff; font-size: 34px; font-weight: 600; text-shadow: 0 2px 8px #000; transition: opacity 0.6s; }
      #title small { display: block; font-size: 24px; font-weight: 400; opacity: 0.8; }
      /* Next episode (design approved 2026-11-18): the TV app's pop-up with the remote on it, at its size on a 1080p screen. */
      #next { position: absolute; right: 6.4rem; bottom: 6.4rem; height: 8.8rem; display: flex; align-items: center; gap: 2rem; padding: 0 4rem 0 2.8rem; border-radius: 4.4rem; background: #fff; max-width: 64rem; box-sizing: border-box; }
      #next[hidden] { display: none; }
      /* While it loads: the app's ring (src/components/play-button.tsx) at its size on a 1080p screen, and after 8 s the app's slow line under it (2026-11-18). */
      #wait { position: absolute; left: 50%; top: 50%; width: 16.8rem; height: 16.8rem; margin: -8.4rem 0 0 -8.4rem; }
      #wait[hidden] { display: none; }
      #wait .button { position: absolute; inset: 1.2rem; border-radius: 50%; background: rgba(255, 255, 255, 0.18); animation: breathe 1.4s ease-in-out infinite; }
      #wait .track, #wait .arc { position: absolute; inset: 0; border-radius: 50%; border: 0.6rem solid rgba(255, 255, 255, 0.14); box-sizing: border-box; }
      #wait .arc { border-color: transparent; border-top-color: #a99bff; border-right-color: rgba(169, 155, 255, 0.35); animation: turn 1.1s linear infinite; }
      #slow { position: absolute; left: 0; right: 0; top: calc(50% + 10.8rem); text-align: center; color: rgba(255, 255, 255, 0.72); font-size: 2.6rem; line-height: 3.6rem; font-weight: 500; white-space: pre-line; }
      #slow[hidden] { display: none; }
      /* Episodes (design approved 2026-11-18): the TV app's strip (src/components/episodes-panel.tsx, tv-title.tsx TvEpisodes) at its size on a 1080p screen. */
      #episodes { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(14, 15, 19, 0.94); padding: 4rem 0 1.6rem; }
      #episodes[hidden] { display: none; }
      #episodes .seasons { display: flex; gap: 1.2rem; padding: 0 9.6rem; margin-bottom: 2.8rem; }
      #episodes .season { padding: 1rem 3.2rem; border-radius: 99.9rem; font-size: 2.7rem; font-weight: 600; color: #a3a6b1; }
      #episodes .season.shown { background: rgba(255, 255, 255, 0.12); }
      #episodes .season.on { background: #fff; color: #0e0f13; }
      #episodes .row { display: flex; gap: 3.2rem; padding: 0 9.6rem; overflow: hidden; }
      #episodes .ep { width: 39.2rem; flex: none; }
      #episodes .still { width: 39.2rem; height: 22rem; border-radius: 2rem; overflow: hidden; position: relative; background: #22242c center / cover no-repeat; transition: transform 0.12s; }
      #episodes .ep.on .still { transform: scale(1.06); box-shadow: 0 0 0 0.2rem #fff; }
      #episodes .playing { position: absolute; top: 1.6rem; left: 1.6rem; padding: 0.4rem 1.4rem; border-radius: 1rem; background: #6b4eff; font-size: 2.2rem; font-weight: 600; color: #fff; }
      #episodes .tick { position: absolute; top: 1.2rem; right: 1.2rem; width: 4rem; height: 4rem; border-radius: 2rem; background: rgba(14, 15, 19, 0.75); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: #fff; }
      #episodes .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 0.8rem; background: rgba(255, 255, 255, 0.25); }
      #episodes .bar i { display: block; height: 0.8rem; background: #9b89ff; }
      #episodes .t { font-size: 2.6rem; font-weight: 600; color: #f4f4f6; margin-top: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { opacity: 0.45; } }
      #next svg { width: 3.2rem; height: 3.2rem; flex: none; }
      #next .t { color: #0e0f13; font-size: 2.6rem; line-height: 3.2rem; font-weight: 600; }
      #next .n { color: #0e0f13; font-size: 2.2rem; line-height: 2.8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <video playsinline></video>
    <div id="title"></div>
    <div id="line"></div>
    <div id="wait" hidden><div class="track"></div><div class="button"></div><div class="arc"></div></div>
    <div id="slow" hidden></div>
    <div id="episodes" hidden><div class="seasons"></div><div class="row"></div></div>
    <div id="next" hidden>
      <svg viewBox="0 0 512 512" fill="#0e0f13" aria-hidden="true"><path d="M80 116.67v278.66c0 18.35 21.33 29.81 37 19.93l209.9-139.32c14.14-9.39 14.14-30.47 0-39.86L117 96.74C101.33 86.86 80 98.32 80 116.67zM400 80h-32a16 16 0 0 0-16 16v320a16 16 0 0 0 16 16h32a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16z"/></svg>
      <div><div class="t">Next episode</div><div class="n"></div></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
